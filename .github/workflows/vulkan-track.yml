name: Vulkan Track (3D acceleration)
on:
  workflow_dispatch:
    inputs:
      moltenvk_ref:
        description: 'MoltenVK git ref (tag/branch/commit)'
        required: false
        default: ''
  push:
    paths:
      - 'gpu-rd/**'
      - 'scripts/link_moltenvk.py'
      - '.github/workflows/vulkan-track.yml'

jobs:
  build-moltenvk:
    name: MoltenVK xcframework (ios-arm64)
    runs-on: macos-26
    timeout-minutes: 60
    env:
      MOLTENVK_REF: ${{ github.event.inputs.moltenvk_ref || 'v1.4.2' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Cache MoltenVK build
        id: cache-mvk
        uses: actions/cache@v4
        with:
          path: gpu-rd/moltenvk/build
          key: moltenvk-${{ env.MOLTENVK_REF }}-ios-arm64
      - name: Build
        if: steps.cache-mvk.outputs.cache-hit != 'true'
        run: |
          chmod +x gpu-rd/moltenvk/build.sh
          gpu-rd/moltenvk/build.sh "$MOLTENVK_REF"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoltenVK-ios-arm64
          path: |
            gpu-rd/moltenvk/build/MoltenVK.xcframework
            gpu-rd/moltenvk/module

  build-app-vulkan:
    name: App with Vulkan probe
    runs-on: macos-26
    needs: build-moltenvk
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Download MoltenVK
        uses: actions/download-artifact@v4
        with:
          name: MoltenVK-ios-arm64
          path: gpu-rd/moltenvk
      - name: Cache Sysroot
        id: cache-sysroot
        uses: actions/cache/restore@v4
        with:
          path: ./sysroot-ios-arm64
          key: ios-arm64-${{ hashFiles('scripts/build_dependencies.sh', 'scripts/fixup.sh') }}-${{ hashFiles('patches/**') }}
          fail-on-cache-miss: false
      - name: Build Sysroot (if uncached)
        if: steps.cache-sysroot.outputs.cache-hit != 'true'
        run: |
          NEWEST_XCODE="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)"
          if [ -n "$NEWEST_XCODE" ]; then sudo xcode-select -s "$NEWEST_XCODE"; fi
          echo "DEVELOPER_DIR=$(xcode-select -p)" >> $GITHUB_ENV
          export PATH="/opt/homebrew/opt/bison/bin:/usr/local/opt/bison/bin:$PATH"
          brew install bison pkg-config gettext glib-utils libgpg-error nasm make meson cmake spirv-tools llvm spirv-llvm-translator libxcb libxrandr
          pip3 install --break-system-packages --user six pyparsing pyyaml setuptools distlib mako
          ./scripts/build_dependencies.sh -p ios -a arm64
      - name: Link MoltenVK into project
        run: python3 scripts/link_moltenvk.py
      - name: Build app (JIT edition)
        run: |
          ./scripts/build_utm.sh -k iphoneos -s iOS -a arm64 -o UTM
          tar -acf UTM.xcarchive.tgz UTM.xcarchive
      - name: Install ldid
        run: brew install ldid
      - name: Package IPA
        run: |
          tar -xf UTM.xcarchive.tgz
          ./scripts/package.sh ipa UTM.xcarchive .
          mv UTM.ipa SteamPhone-JIT-VulkanProbe.ipa
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SteamPhone-JIT-VulkanProbe.ipa
          path: SteamPhone-JIT-VulkanProbe.ipa

  gfxstream-host-spike:
    name: gfxstream host (${{ matrix.target.name }})
    runs-on: macos-26
    needs: build-moltenvk
    continue-on-error: true   # failure == gate data, not a broken build
    timeout-minutes: 75
    strategy:
      matrix:
        target:
          - name: ios-device
            cmake_args: -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphoneos -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF
            needs_mvk: true
          - name: macos-arm64   # control: same code, known-good platform
            cmake_args: -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF
            needs_mvk: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download MoltenVK (iOS leg compiles against its Vulkan headers)
        if: matrix.target.needs_mvk
        uses: actions/download-artifact@v4
        with:
          name: MoltenVK-ios-arm64
          path: gpu-rd/moltenvk
      - name: Fetch gfxstream
        run: |
          git clone --depth 1 https://github.com/google/gfxstream gpu-rd/gfxstream-host/src
      - name: Patch macOS-only includes for iOS (libproc.h missing from SDK)
        run: |
          chmod +x gpu-rd/gfxstream-host/patch-ios.sh
          if [[ "${{ matrix.target.name }}" == ios* ]]; then
            gpu-rd/gfxstream-host/patch-ios.sh gpu-rd/gfxstream-host/src ios
          else
            gpu-rd/gfxstream-host/patch-ios.sh gpu-rd/gfxstream-host/src
          fi
      - name: Configure (${{ matrix.target.name }})
        run: |
          EXTRA=""
          if [[ "${{ matrix.target.name }}" == ios* ]]; then
            # MoltenVK first (Vulkan entry points), then gfxstream's vendored
            # vulkan headers (vk_enum_string_helper.h etc.) which MoltenVK's
            # dir must not shadow, then the video headers sibling.
            EXTRA="-DCMAKE_CXX_FLAGS=-I$PWD/gpu-rd/moltenvk/module/vulkan -I$PWD/gpu-rd/moltenvk/module/vk_video -I$PWD/gpu-rd/gfxstream-host/src/third_party/vulkan/include"
          fi
          set -o pipefail
          cmake -S gpu-rd/gfxstream-host/src -B gpu-rd/gfxstream-host/build/${{ matrix.target.name }} \
            ${{ matrix.target.cmake_args }} \
            $EXTRA \
            -DBUILD_TESTING=OFF \
            -DCMAKE_INSTALL_PREFIX=$PWD/gfxstream-host/prefix-${{ matrix.target.name }} \
            2>&1 | tee gpu-rd/gfxstream-host/configure-${{ matrix.target.name }}.log
      - name: Build + install host renderer
        run: |
          set -o pipefail
          (cmake --build gpu-rd/gfxstream-host/build/${{ matrix.target.name }} --parallel 4 || \
          cmake --build gpu-rd/gfxstream-host/build/${{ matrix.target.name }}) 2>&1 | tee gpu-rd/gfxstream-host/build-${{ matrix.target.name }}.log
          cmake --install gpu-rd/gfxstream-host/build/${{ matrix.target.name }} || true
          # Write the pc file rutabaga's meson consumes.
          P=gpu-rd/gfxstream-host/prefix-${{ matrix.target.name }}
          mkdir -p "$P/lib/pkgconfig" "$P/include"
          cp -R gpu-rd/gfxstream-host/src/include/. "$P/include/" 2>/dev/null || true
          cat > "$P/lib/pkgconfig/gfxstream_backend.pc" <<EOF
          prefix=$PWD/$P
          libdir=\${prefix}/lib
          includedir=\${prefix}/include

          Name: gfxstream_backend
          Description: gfxstream host renderer (SteamPhone 3D chain)
          Version: 0.1.2
          Libs: -L\${libdir} -lgfxstream_backend
          Cflags: -I\${includedir}
          EOF
          find "$P" -name '*.a' -o -name '*.pc' | head -20
      - name: Upload host prefix + build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gfxstream-host-${{ matrix.target.name }}
          path: |
            gpu-rd/gfxstream-host/prefix-${{ matrix.target.name }}
            gpu-rd/gfxstream-host/build-${{ matrix.target.name }}.log
            gpu-rd/gfxstream-host/configure-${{ matrix.target.name }}.log

  qemu-rutabaga-spike:
    name: QEMU virtio-gpu-rutabaga (spike, gate data)
    runs-on: macos-26
    continue-on-error: true   # failure == gate data, not a broken build
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run fork spike (fetch pinned QEMU, apply UTM patch, build rutabaga, configure)
        run: |
          chmod +x gpu-rd/qemu-side/build-fork.sh gpu-rd/qemu-side/build-rutabaga.sh
          bash gpu-rd/qemu-side/build-fork.sh 2>&1 | tee qemu-spike.log
      - name: Gate summary
        if: always()
        run: |
          grep -E "GATE (PASS|DATA)" qemu-spike.log || echo "no gate lines — inspect log"
      - name: Upload spike log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-rutabaga-spike-log
          path: qemu-spike.log

  sysroot-3d:
    name: Sysroot with 3D chain (fast path)
    runs-on: macos-26
    needs: build-moltenvk
    continue-on-error: true
    timeout-minutes: 100
    env:
      RUTABAGA_TRACK: '1'
      SPGB_SKIP_GFXSTREAM: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Restore base sysroot (built by the main Build workflow)
        id: base
        uses: actions/cache/restore@v4
        with:
          path: ./sysroot-ios-arm64
          key: ios-arm64-${{ hashFiles('scripts/build_dependencies.sh', 'scripts/fixup.sh') }}-${{ hashFiles('patches/**') }}
          restore-keys: ios-arm64-${{ hashFiles('scripts/build_dependencies.sh', 'scripts/fixup.sh') }}-${{ hashFiles('patches/**') }}
          fail-on-cache-miss: false
      - name: Setup Path
        run: echo "/usr/local/opt/bison/bin:/opt/homebrew/opt/bison/bin" >> $GITHUB_PATH
      - name: Run 3D chain into the base sysroot
        run: |
          NEWEST_XCODE="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)"
          if [ -n "$NEWEST_XCODE" ]; then sudo xcode-select -s "$NEWEST_XCODE"; fi
          export PREFIX="$PWD/sysroot-ios-arm64"
          export SPGB_CHAIN_PREFIX="$PREFIX/spgb-chain"
          set -o pipefail
          bash gpu-rd/build-3d-chain.sh 2>&1 | tee chain.log
      - name: Upload chain log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sysroot-3d-chain-log
          path: chain.log
      - name: Rebuild only QEMU with the chain (replaces its libs in the sysroot)
        run: |
          NEWEST_XCODE="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)"
          if [ -n "$NEWEST_XCODE" ]; then sudo xcode-select -s "$NEWEST_XCODE"; fi
          WORK="$PWD/qemu-3d-build"; mkdir -p "$WORK"; cd "$WORK"
          if [ ! -d qemu-10.0.12-utm ]; then
            curl -fL --retry 3 -o qemu.tar.xz https://github.com/utmapp/qemu/releases/download/v10.0.12-utm/qemu-10.0.12-utm.tar.xz
            tar -xf qemu.tar.xz
          fi
          cd qemu-10.0.12-utm
          [ -f .utm-patched ] || { patch -p1 < "$GITHUB_WORKSPACE/patches/qemu-10.0.12-utm.patch"; touch .utm-patched; }
          export PKG_CONFIG_PATH="$GITHUB_WORKSPACE/sysroot-ios-arm64/spgb-chain/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
          export PKG_CONFIG_SYSROOT_DIR="$GITHUB_WORKSPACE/sysroot-ios-arm64"
          export PKG_CONFIG_LIBDIR="$GITHUB_WORKSPACE/sysroot-ios-arm64/lib/pkgconfig"
          mkdir -p build && cd build
          ../configure             --prefix="$GITHUB_WORKSPACE/sysroot-ios-arm64"             --enable-shared-lib --disable-cocoa --disable-sdl --disable-coreaudio             --disable-slirp-smbd --enable-ucontext --with-coroutine=libucontext             --target-list=aarch64-softmmu 2>&1 | tee ../configure.log
          grep -i rutabaga ../configure.log || echo "(no rutabaga line in configure log)"
          make -j"$(sysctl -n hw.ncpu)" 2>&1 | tail -5
          make install
          echo "== rutabaga symbols in installed libcommon.a:"
          nm "$GITHUB_WORKSPACE/sysroot-ios-arm64/lib/libcommon.a" 2>/dev/null | grep -c virtio_gpu_rutabaga || echo 0
      - name: Save 3D Sysroot Cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: ./sysroot-ios-arm64
          key: ios-arm64-3d-${{ github.run_id }}
      - name: Upload sysroot (3D) for the app job
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sysroot-3d
          path: sysroot-ios-arm64/spgb-chain

  build-app-3d:
    name: Engine with 3D chain (experimental)
    runs-on: macos-26
    needs: sysroot-3d
    continue-on-error: true
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Download 3D sysroot
        uses: actions/download-artifact@v4
        with:
          name: sysroot-3d
          path: sysroot-ios-arm64/spgb-chain
      - name: Link MoltenVK into project
        run: python3 scripts/link_moltenvk.py || echo "link skipped (framework missing)"
      - name: Build experimental IPA
        run: |
          ./scripts/build_utm.sh -k iphoneos -s iOS -a arm64 -o UTM
          tar -acf UTM-3D.xcarchive.tgz UTM.xcarchive
      - name: Install ldid
        run: brew install ldid
      - name: Package
        run: |
          tar -xf UTM-3D.xcarchive.tgz
          ./scripts/package.sh ipa UTM.xcarchive .
          mv UTM.ipa SteamPhone-3D-experimental.ipa
      - name: Upload experimental IPA
        uses: actions/upload-artifact@v4
        with:
          name: SteamPhone-3D-experimental.ipa
          path: SteamPhone-3D-experimental.ipa
